<svg viewBox="0 0 540 280" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -16; }
      }
      .tree-branch { stroke: #64748B; stroke-width: 1.5; stroke-linecap: round; }
      .flow-path { stroke: #2563EB; stroke-width: 1.5; stroke-dasharray: 4,4; animation: flowDash 2s linear infinite; }
      .prime-glow { animation: pulseGlow 2.5s ease-in-out infinite; }
      .label-text { font-family: 'JetBrains Mono', 'Segoe UI', system-ui, sans-serif; }
    </style>

    <!-- Linear Gradients for Nodes -->
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    
    <linearGradient id="primeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <linearGradient id="compositeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Canvas Backdrop -->
  <rect x="4" y="4" width="532" height="272" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Subtle Coordinate Graph Grid -->
  <g stroke="#F1F5F9" stroke-width="0.75">
    <line x1="20" y1="40" x2="520" y2="40"/>
    <line x1="20" y1="80" x2="520" y2="80"/>
    <line x1="20" y1="120" x2="520" y2="120"/>
    <line x1="20" y1="160" x2="520" y2="160"/>
    <line x1="20" y1="200" x2="520" y2="200"/>
    <line x1="20" y1="240" x2="520" y2="240"/>
  </g>

  <!-- Header Badge -->
  <rect x="100" y="12" width="340" height="22" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="270" y="27" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="bold" class="label-text">PRIME FACTORIZATION: 32760 = 2³ × 3² × 5 × 7 × 13</text>

  <!-- BRANCH LINES -->
  <!-- Level 0 to 1 -->
  <line x1="165" y1="64" x2="105" y2="96" class="tree-branch"/>
  <line x1="165" y1="64" x2="225" y2="96" class="tree-branch"/>
  
  <!-- Level 1 to 2 -->
  <line x1="225" y1="114" x2="165" y2="146" class="tree-branch"/>
  <line x1="225" y1="114" x2="285" y2="146" class="tree-branch"/>

  <!-- Level 2 to 3 -->
  <line x1="285" y1="164" x2="225" y2="196" class="tree-branch"/>
  <line x1="285" y1="164" x2="345" y2="196" class="tree-branch"/>

  <!-- Level 3 to 4 -->
  <line x1="345" y1="214" x2="290" y2="244" class="tree-branch"/>
  <line x1="345" y1="214" x2="395" y2="244" class="tree-branch"/>

  <!-- Animated Active Flow (Left Branch Prime Extraction Path) -->
  <path d="M165,64 L105,96 M225,114 L165,146 M285,164 L225,196 M345,214 L290,244" class="flow-path"/>

  <!-- NODES -->
  
  <!-- Level 0: Root 32760 -->
  <g filter="url(#shadow)">
    <rect x="135" y="46" width="60" height="24" rx="6" fill="url(#rootGrad)"/>
    <text x="165" y="62" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold" class="label-text">32760</text>
  </g>

  <!-- Level 1: 2 & 16380 -->
  <g filter="url(#shadow)">
    <!-- Prime 2 -->
    <circle cx="105" cy="105" r="14" fill="url(#primeGrad)"/>
    <circle cx="105" cy="105" r="17" fill="none" stroke="#22C55E" stroke-width="1.5" class="prime-glow"/>
    <text x="105" y="109" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold" class="label-text">2</text>
    
    <!-- Composite 16380 -->
    <rect x="195" y="93" width="60" height="24" rx="5" fill="url(#compositeGrad)" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="225" y="109" text-anchor="middle" fill="#0F172A" font-size="10" font-weight="bold" class="label-text">16380</text>
  </g>

  <!-- Level 2: 2 & 8190 -->
  <g filter="url(#shadow)">
    <!-- Prime 2 -->
    <circle cx="165" cy="155" r="14" fill="url(#primeGrad)"/>
    <circle cx="165" cy="155" r="17" fill="none" stroke="#22C55E" stroke-width="1.5" class="prime-glow"/>
    <text x="165" y="159" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold" class="label-text">2</text>
    
    <!-- Composite 8190 -->
    <rect x="257" y="143" width="56" height="24" rx="5" fill="url(#compositeGrad)" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="285" y="159" text-anchor="middle" fill="#0F172A" font-size="10" font-weight="bold" class="label-text">8190</text>
  </g>

  <!-- Level 3: 2 & 4095 -->
  <g filter="url(#shadow)">
    <!-- Prime 2 -->
    <circle cx="225" cy="205" r="14" fill="url(#primeGrad)"/>
    <circle cx="225" cy="205" r="17" fill="none" stroke="#22C55E" stroke-width="1.5" class="prime-glow"/>
    <text x="225" y="209" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold" class="label-text">2</text>
    
    <!-- Composite 4095 -->
    <rect x="317" y="193" width="56" height="24" rx="5" fill="url(#compositeGrad)" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="345" y="209" text-anchor="middle" fill="#0F172A" font-size="10" font-weight="bold" class="label-text">4095</text>
  </g>

  <!-- Level 4: 3 & Continuation -->
  <g filter="url(#shadow)">
    <!-- Prime 3 -->
    <circle cx="290" cy="252" r="14" fill="url(#primeGrad)"/>
    <circle cx="290" cy="252" r="17" fill="none" stroke="#22C55E" stroke-width="1.5" class="prime-glow"/>
    <text x="290" y="256" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold" class="label-text">3</text>
    
    <!-- Remaining Sub-tree Indicator -->
    <rect x="365" y="240" width="60" height="24" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="395" y="256" text-anchor="middle" fill="#1D4ED8" font-size="9" font-weight="bold" class="label-text">... × 13</text>
  </g>

  <!-- CALLOUT & PEDAGOGICAL ANNOTATION PANELS -->
  
  <!-- Left Side Callout: Smallest Prime Factor Rule -->
  <g>
    <!-- Pointer Dot & Line -->
    <circle cx="105" cy="105" r="2.5" fill="#15803D"/>
    <polyline points="105,105 55,105 55,72" fill="none" stroke="#16A34A" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Card -->
    <rect x="18" y="44" width="100" height="38" rx="5" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <text x="68" y="57" text-anchor="middle" fill="#166534" font-size="9" font-weight="bold" class="label-text">LEFT BRANCH</text>
    <text x="68" y="69" text-anchor="middle" fill="#15803D" font-size="8" class="label-text">Always lowest prime factor</text>
  </g>

  <!-- Right Side Callout: Continuation Rule -->
  <g>
    <!-- Pointer Dot & Line -->
    <circle cx="345" cy="193" r="2.5" fill="#2563EB"/>
    <polyline points="345,193 425,193 425,150" fill="none" stroke="#2563EB" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Card -->
    <rect x="385" y="105" width="135" height="42" rx="5" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="452" y="119" text-anchor="middle" fill="#1E40AF" font-size="9" font-weight="bold" class="label-text">RIGHT BRANCH</text>
    <text x="452" y="131" text-anchor="middle" fill="#1D4ED8" font-size="8" class="label-text">Quotient continues division</text>
    <text x="452" y="141" text-anchor="middle" fill="#1D4ED8" font-size="8" class="label-text">until prime is reached</text>
  </g>

  <!-- Prime Factorization Summary Box (Bottom Right) -->
  <g filter="url(#shadow)">
    <rect x="375" y="175" width="145" height="52" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="375" y="175" width="145" height="16" rx="6" fill="#E2E8F0"/>
    <!-- Overlap bottom rounded corners of header bar -->
    <rect x="375" y="185" width="145" height="6" fill="#E2E8F0"/>
    <text x="447" y="186" text-anchor="middle" fill="#334155" font-size="8" font-weight="bold" class="label-text">PRIME FACTOR EXPANSION</text>
    
    <text x="447" y="204" text-anchor="middle" fill="#0F172A" font-size="9" font-weight="bold" class="label-text">2³ × 3² × 5¹ × 7¹ × 13¹</text>
    <text x="447" y="218" text-anchor="middle" fill="#16A34A" font-size="8" font-weight="bold" class="label-text">8 × 9 × 5 × 7 × 13 = 32760</text>
  </g>

  <!-- Legend Badges (Bottom Left) -->
  <g transform="translate(18, 242)">
    <rect x="0" y="0" width="150" height="22" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Circle Legend Item -->
    <circle cx="12" cy="11" r="5" fill="#22C55E"/>
    <text x="22" y="14" fill="#334155" font-size="8" font-weight="bold" class="label-text">Prime Factor</text>
    
    <!-- Rect Legend Item -->
    <rect x="82" y="6" width="10" height="10" rx="2" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="96" y="14" fill="#334155" font-size="8" font-weight="bold" class="label-text">Composite</text>
  </g>

</svg>