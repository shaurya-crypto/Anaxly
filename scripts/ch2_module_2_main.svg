<svg viewBox="0 0 540 280" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" xmlns="http://www.w3.org/2000/svg">
  <!-- Background & Canvas -->
  <rect x="4" y="4" width="532" height="272" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  
  <!-- Header Badge -->
  <rect x="110" y="12" width="320" height="22" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="270" y="27" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="bold" font-family="'JetBrains Mono', 'Segoe UI', sans-serif">GEOMETRICAL MEANING OF ZEROES: QUADRATIC</text>

  <!-- Case (i): 2 Distinct Zeroes -->
  <g transform="translate(25, 50)">
    <rect x="0" y="0" width="150" height="180" rx="6" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
    <!-- Grid -->
    <path d="M 0 40 H 150 M 0 80 H 150 M 0 120 H 150 M 0 160 H 150 M 30 0 V 180 M 75 0 V 180 M 120 0 V 180" stroke="#F1F5F9" stroke-width="0.5"/>
    <!-- Axes -->
    <line x1="10" y1="110" x2="140" y2="110" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrowhead)"/>
    <line x1="75" y1="170" x2="75" y2="20" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrowhead)"/>
    <!-- Parabola -->
    <path d="M 25,30 Q 75,210 125,30" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <!-- Intercepts -->
    <circle cx="48" cy="110" r="3" fill="#DC2626"/>
    <circle cx="102" cy="110" r="3" fill="#DC2626"/>
    <!-- Labels -->
    <text x="75" y="205" text-anchor="middle" fill="#0F172A" font-size="10" font-weight="bold" font-family="system-ui">Case (i): 2 Zeroes</text>
    <text x="75" y="218" text-anchor="middle" fill="#64748B" font-size="9" font-family="system-ui">D &gt; 0 (Two Intersections)</text>
  </g>

  <!-- Case (ii): 1 Zero (Touching) -->
  <g transform="translate(195, 50)">
    <rect x="0" y="0" width="150" height="180" rx="6" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
    <!-- Grid -->
    <path d="M 0 40 H 150 M 0 80 H 150 M 0 120 H 150 M 0 160 H 150 M 30 0 V 180 M 75 0 V 180 M 120 0 V 180" stroke="#F1F5F9" stroke-width="0.5"/>
    <!-- Axes -->
    <line x1="10" y1="110" x2="140" y2="110" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrowhead)"/>
    <line x1="75" y1="170" x2="75" y2="20" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrowhead)"/>
    <!-- Parabola -->
    <path d="M 25,30 Q 75,110 125,30" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
    <!-- Intercept -->
    <circle cx="75" cy="110" r="3" fill="#DC2626"/>
    <!-- Labels -->
    <text x="75" y="205" text-anchor="middle" fill="#0F172A" font-size="10" font-weight="bold" font-family="system-ui">Case (ii): 1 Zero</text>
    <text x="75" y="218" text-anchor="middle" fill="#64748B" font-size="9" font-family="system-ui">D = 0 (One Touching Point)</text>
  </g>

  <!-- Case (iii): 0 Zeroes (No Intersection) -->
  <g transform="translate(365, 50)">
    <rect x="0" y="0" width="150" height="180" rx="6" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
    <!-- Grid -->
    <path d="M 0 40 H 150 M 0 80 H 150 M 0 120 H 150 M 0 160 H 150 M 30 0 V 180 M 75 0 V 180 M 120 0 V 180" stroke="#F1F5F9" stroke-width="0.5"/>
    <!-- Axes -->
    <line x1="10" y1="110" x2="140" y2="110" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrowhead)"/>
    <line x1="75" y1="170" x2="75" y2="20" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrowhead)"/>
    <!-- Parabola -->
    <path d="M 25,20 Q 75,80 125,20" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
    <!-- Labels -->
    <text x="75" y="205" text-anchor="middle" fill="#0F172A" font-size="10" font-weight="bold" font-family="system-ui">Case (iii): 0 Zeroes</text>
    <text x="75" y="218" text-anchor="middle" fill="#64748B" font-size="9" font-family="system-ui">D &lt; 0 (No Intersection)</text>
  </g>

  <!-- Definitions for Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Legend / Formula Badge -->
  <rect x="180" y="255" width="180" height="18" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="270" y="268" text-anchor="middle" fill="#0F172A" font-size="9" font-family="'JetBrains Mono', monospace">p(x) = ax² + bx + c</text>
</svg>