<svg viewBox="0 0 540 280" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes strokePulse {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 1; }
      }
      @keyframes exponentGlow {
        0%, 100% { fill: #DC2626; transform: scale(1); }
        50% { fill: #2563EB; transform: scale(1.15); }
      }
      .card { transition: all 0.3s ease; }
      .degree-badge { font-family: 'JetBrains Mono', system-ui, sans-serif; font-weight: bold; }
      .math-text { font-family: 'Georgia', 'Times New Roman', serif; font-style: italic; }
      .code-text { font-family: 'JetBrains Mono', monospace; }
      .pulse-line { animation: strokePulse 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect x="4" y="4" width="532" height="272" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Subtle Background Grid Pattern -->
  <g stroke="#F1F5F9" stroke-width="0.75">
    <line x1="20" y1="40" x2="520" y2="40"/>
    <line x1="20" y1="80" x2="520" y2="80"/>
    <line x1="20" y1="120" x2="520" y2="120"/>
    <line x1="20" y1="160" x2="520" y2="160"/>
    <line x1="20" y1="200" x2="520" y2="200"/>
    <line x1="20" y1="240" x2="520" y2="240"/>
  </g>

  <!-- Header Badge -->
  <rect x="110" y="12" width="320" height="22" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="270" y="27" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="bold" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif">
    DEGREE &amp; CLASSIFICATION MATRIX
  </text>

  <!-- Key Concept Indicator Bar -->
  <rect x="20" y="42" width="500" height="22" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="270" y="57" text-anchor="middle" fill="#475569" font-size="10" font-weight="600" font-family="'Segoe UI', system-ui, sans-serif">
    Degree (n) = Highest Power of Variable <tspan class="math-text" fill="#0F172A">x</tspan> in <tspan class="math-text" fill="#0F172A">p(x) = a<tspan font-style="normal">x</tspan><tspan font-size="8" font-style="normal" baseline-shift="super" fill="#DC2626">n</tspan> + ...</tspan>
  </text>

  <!-- ================= CARD 1: LINEAR ================= -->
  <g class="card" transform="translate(20, 72)">
    <!-- Main Card Body -->
    <rect x="0" y="0" width="156" height="190" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="0" y="0" width="156" height="28" rx="8" fill="#EFF6FF"/>
    <path d="M 0 20 L 0 28 L 156 28 L 156 20 Z" fill="#EFF6FF"/>
    <line x1="0" y1="28" x2="156" y2="28" stroke="#BFDBFE" stroke-width="1.5"/>
    
    <!-- Title -->
    <text x="78" y="19" fill="#2563EB" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif">LINEAR</text>
    
    <!-- Degree Pill -->
    <rect x="38" y="36" width="80" height="18" rx="9" fill="#2563EB"/>
    <text x="78" y="49" fill="#FFFFFF" class="degree-badge" font-size="9" text-anchor="middle">DEGREE n = 1</text>
    
    <!-- Miniature Graph Vector Visual -->
    <g transform="translate(18, 62)">
      <rect x="0" y="0" width="120" height="46" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <!-- Grid -->
      <line x1="60" y1="4" x2="60" y2="42" stroke="#F1F5F9" stroke-width="1"/>
      <line x1="4" y1="23" x2="116" y2="23" stroke="#F1F5F9" stroke-width="1"/>
      <!-- Axes -->
      <line x1="60" y1="6" x2="60" y2="40" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="10" y1="23" x2="110" y2="23" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,2"/>
      <!-- Graph Line (y = mx + c) -->
      <line x1="20" y1="37" x2="100" y2="9" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
      <circle cx="60" cy="23" r="2" fill="#2563EB"/>
    </g>

    <!-- Standard Form Block -->
    <rect x="12" y="116" width="132" height="30" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="66" y="130" text-anchor="middle" font-size="9" fill="#64748B" font-family="'Segoe UI', system-ui, sans-serif">Standard Form</text>
    <text x="66" y="142" text-anchor="middle" class="math-text" font-size="12" fill="#0F172A">
      ax<tspan font-size="8" font-style="normal" baseline-shift="super" fill="#DC2626" font-weight="bold">1</tspan> + b
    </text>

    <!-- Concrete Example -->
    <rect x="12" y="152" width="132" height="28" rx="5" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="66" y="164" text-anchor="middle" font-size="8" fill="#2563EB" font-weight="600" font-family="'Segoe UI', system-ui, sans-serif">EXAMPLE</text>
    <text x="66" y="174" text-anchor="middle" class="math-text" font-size="10" fill="#1E40AF">
      p(x) = 2x + 3
    </text>
  </g>

  <!-- ================= CARD 2: QUADRATIC ================= -->
  <g class="card" transform="translate(192, 72)">
    <!-- Main Card Body -->
    <rect x="0" y="0" width="156" height="190" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="0" y="0" width="156" height="28" rx="8" fill="#F0FDF4"/>
    <path d="M 0 20 L 0 28 L 156 28 L 156 20 Z" fill="#F0FDF4"/>
    <line x1="0" y1="28" x2="156" y2="28" stroke="#BBF7D0" stroke-width="1.5"/>
    
    <!-- Title -->
    <text x="78" y="19" fill="#16A34A" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif">QUADRATIC</text>
    
    <!-- Degree Pill -->
    <rect x="38" y="36" width="80" height="18" rx="9" fill="#16A34A"/>
    <text x="78" y="49" fill="#FFFFFF" class="degree-badge" font-size="9" text-anchor="middle">DEGREE n = 2</text>
    
    <!-- Miniature Graph Vector Visual -->
    <g transform="translate(18, 62)">
      <rect x="0" y="0" width="120" height="46" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <!-- Grid -->
      <line x1="60" y1="4" x2="60" y2="42" stroke="#F1F5F9" stroke-width="1"/>
      <line x1="4" y1="32" x2="116" y2="32" stroke="#F1F5F9" stroke-width="1"/>
      <!-- Axes -->
      <line x1="60" y1="6" x2="60" y2="40" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="10" y1="32" x2="110" y2="32" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,2"/>
      <!-- Parabola Curve (y = ax^2 + c) -->
      <path d="M 25 8 Q 60 44 95 8" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
      <circle cx="60" cy="26" r="2" fill="#16A34A"/>
    </g>

    <!-- Standard Form Block -->
    <rect x="12" y="116" width="132" height="30" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="66" y="130" text-anchor="middle" font-size="9" fill="#64748B" font-family="'Segoe UI', system-ui, sans-serif">Standard Form</text>
    <text x="66" y="142" text-anchor="middle" class="math-text" font-size="12" fill="#0F172A">
      ax<tspan font-size="8" font-style="normal" baseline-shift="super" fill="#DC2626" font-weight="bold">2</tspan> + bx + c
    </text>

    <!-- Concrete Example -->
    <rect x="12" y="152" width="132" height="28" rx="5" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <text x="66" y="164" text-anchor="middle" font-size="8" fill="#16A34A" font-weight="600" font-family="'Segoe UI', system-ui, sans-serif">EXAMPLE</text>
    <text x="66" y="174" text-anchor="middle" class="math-text" font-size="10" fill="#14532D">
      p(x) = x<tspan font-size="7" font-style="normal" baseline-shift="super">2</tspan> - 3x - 4
    </text>
  </g>

  <!-- ================= CARD 3: CUBIC ================= -->
  <g class="card" transform="translate(364, 72)">
    <!-- Main Card Body -->
    <rect x="0" y="0" width="156" height="190" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="0" y="0" width="156" height="28" rx="8" fill="#FEF3C7"/>
    <path d="M 0 20 L 0 28 L 156 28 L 156 20 Z" fill="#FEF3C7"/>
    <line x1="0" y1="28" x2="156" y2="28" stroke="#FDE68A" stroke-width="1.5"/>
    
    <!-- Title -->
    <text x="78" y="19" fill="#D97706" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif">CUBIC</text>
    
    <!-- Degree Pill -->
    <rect x="38" y="36" width="80" height="18" rx="9" fill="#D97706"/>
    <text x="78" y="49" fill="#FFFFFF" class="degree-badge" font-size="9" text-anchor="middle">DEGREE n = 3</text>
    
    <!-- Miniature Graph Vector Visual -->
    <g transform="translate(18, 62)">
      <rect x="0" y="0" width="120" height="46" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <!-- Grid -->
      <line x1="60" y1="4" x2="60" y2="42" stroke="#F1F5F9" stroke-width="1"/>
      <line x1="4" y1="23" x2="116" y2="23" stroke="#F1F5F9" stroke-width="1"/>
      <!-- Axes -->
      <line x1="60" y1="6" x2="60" y2="40" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="10" y1="23" x2="110" y2="23" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,2"/>
      <!-- Cubic Curve (y = ax^3 - cx) -->
      <path d="M 20 38 C 40 38, 45 8, 60 23 C 75 38, 80 8, 100 8" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
      <circle cx="60" cy="23" r="2" fill="#D97706"/>
    </g>

    <!-- Standard Form Block -->
    <rect x="12" y="116" width="132" height="30" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="66" y="130" text-anchor="middle" font-size="9" fill="#64748B" font-family="'Segoe UI', system-ui, sans-serif">Standard Form</text>
    <text x="66" y="142" text-anchor="middle" class="math-text" font-size="11" fill="#0F172A">
      ax<tspan font-size="8" font-style="normal" baseline-shift="super" fill="#DC2626" font-weight="bold">3</tspan> + bx<tspan font-size="7" font-style="normal" baseline-shift="super">2</tspan> + cx + d
    </text>

    <!-- Concrete Example -->
    <rect x="12" y="152" width="132" height="28" rx="5" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <text x="66" y="164" text-anchor="middle" font-size="8" fill="#D97706" font-weight="600" font-family="'Segoe UI', system-ui, sans-serif">EXAMPLE</text>
    <text x="66" y="174" text-anchor="middle" class="math-text" font-size="10" fill="#78350F">
      p(x) = x<tspan font-size="7" font-style="normal" baseline-shift="super">3</tspan> - 4x
    </text>
  </g>

  <!-- Key Exponent Callout Annotations -->
  <g transform="translate(0, 0)">
    <!-- Pointer to highlighted exponent in Linear -->
    <circle cx="106" cy="214" r="2.5" fill="#DC2626"/>
    <!-- Pointer to highlighted exponent in Quadratic -->
    <circle cx="272" cy="214" r="2.5" fill="#DC2626"/>
    <!-- Pointer to highlighted exponent in Cubic -->
    <circle cx="438" cy="214" r="2.5" fill="#DC2626"/>
  </g>
</svg>