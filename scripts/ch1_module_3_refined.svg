<svg viewBox="0 0 540 280" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#2563EB" />
    </marker>
  </defs>

  <!-- Canvas Backdrop -->
  <rect x="4" y="4" width="532" height="272" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Header Pill Badge -->
  <rect x="110" y="12" width="320" height="22" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="270" y="27" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="bold" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif">The Logic of Contradiction</text>

  <!-- Flowchart Nodes and Arrows -->
  <!-- Node 1 -->
  <rect x="170" y="45" width="200" height="22" rx="5" fill="#F0F9FF" stroke="#2563EB" stroke-width="1"/>
  <text x="270" y="60" text-anchor="middle" fill="#0F172A" font-size="10" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif">1. Assume √p = a/b (Rational)</text>
  <line x1="270" y1="67" x2="270" y2="79" stroke="#2563EB" stroke-width="1" marker-end="url(#arrowhead)"/>

  <!-- Node 2 -->
  <rect x="170" y="79" width="200" height="22" rx="5" fill="#F0F9FF" stroke="#2563EB" stroke-width="1"/>
  <text x="270" y="94" text-anchor="middle" fill="#0F172A" font-size="10" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif">2. Square both sides: p = a²/b²</text>
  <line x1="270" y1="101" x2="270" y2="113" stroke="#2563EB" stroke-width="1" marker-end="url(#arrowhead)"/>

  <!-- Node 3 -->
  <rect x="170" y="113" width="200" height="22" rx="5" fill="#F0F9FF" stroke="#2563EB" stroke-width="1"/>
  <text x="270" y="128" text-anchor="middle" fill="#0F172A" font-size="10" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif">3. p divides a² ⇒ p divides a</text>
  <line x1="270" y1="135" x2="270" y2="147" stroke="#2563EB" stroke-width="1" marker-end="url(#arrowhead)"/>

  <!-- Node 4 -->
  <rect x="170" y="147" width="200" height="22" rx="5" fill="#F0F9FF" stroke="#2563EB" stroke-width="1"/>
  <text x="270" y="162" text-anchor="middle" fill="#0F172A" font-size="10" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif">4. Let a = pk (for integer k)</text>
  <line x1="270" y1="169" x2="270" y2="181" stroke="#2563EB" stroke-width="1" marker-end="url(#arrowhead)"/>

  <!-- Node 5 -->
  <rect x="170" y="181" width="200" height="22" rx="5" fill="#F0F9FF" stroke="#2563EB" stroke-width="1"/>
  <text x="270" y="196" text-anchor="middle" fill="#0F172A" font-size="10" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif">5. Substitute into (2): b² = pk² ⇒ p divides b</text>
  <line x1="270" y1="203" x2="270" y2="215" stroke="#2563EB" stroke-width="1" marker-end="url(#arrowhead)"/>

  <!-- Node 6 -->
  <rect x="170" y="215" width="200" height="22" rx="5" fill="#F0F9FF" stroke="#2563EB" stroke-width="1"/>
  <text x="270" y="230" text-anchor="middle" fill="#0F172A" font-size="10" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif">6. p divides both a &amp; b</text>
  <line x1="270" y1="237" x2="270" y2="249" stroke="#2563EB" stroke-width="1" marker-end="url(#arrowhead)"/>

  <!-- Node 7 (Contradiction) -->
  <rect x="170" y="249" width="200" height="22" rx="5" fill="#DC2626" stroke="#DC2626" stroke-width="1"/>
  <text x="270" y="264" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif">7. Contradiction: a, b not coprime</text>

</svg>