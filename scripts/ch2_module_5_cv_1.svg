<svg viewBox="0 0 540 280" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" xmlns="http://www.w3.org/2000/svg">
  <!-- Background & Canvas -->
  <rect x="4" y="4" width="532" height="272" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M20 60 L520 60 M20 100 L520 100 M20 140 L520 140 M20 180 L520 180 M20 220 L520 220" stroke="#F1F5F9" stroke-width="0.75"/>
  
  <!-- Header Badge -->
  <rect x="110" y="12" width="320" height="22" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="270" y="27" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="bold" font-family="'JetBrains Mono', 'Segoe UI', sans-serif">EXERCISE 2.2: POLYNOMIALS MASTER MAP</text>

  <!-- Section Headers -->
  <g transform="translate(20, 45)">
    <rect x="0" y="0" width="245" height="25" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1" stroke-dasharray="2,1"/>
    <text x="122" y="17" text-anchor="middle" fill="#2563EB" font-size="10" font-weight="bold" font-family="'JetBrains Mono', sans-serif">Q1: FIND ZEROES (α, β)</text>
    
    <!-- Q1 Data Rows -->
    <g font-family="'JetBrains Mono', sans-serif" font-size="10" fill="#0F172A">
      <text x="10" y="45"><tspan fill="#64748B">(i)</tspan>  x² - 2x - 8  → <tspan font-weight="bold" fill="#2563EB">4, -2</tspan></text>
      <text x="10" y="75"><tspan fill="#64748B">(ii)</tspan> 4s² - 4s + 1 → <tspan font-weight="bold" fill="#2563EB">1/2, 1/2</tspan></text>
      <text x="10" y="105"><tspan fill="#64748B">(iii)</tspan> 6x² - 3 - 7x → <tspan font-weight="bold" fill="#2563EB">3/2, -1/3</tspan></text>
      <text x="10" y="135"><tspan fill="#64748B">(iv)</tspan> 4u² + 8u     → <tspan font-weight="bold" fill="#2563EB">0, -2</tspan></text>
      <text x="10" y="165"><tspan fill="#64748B">(v)</tspan>  t² - 15      → <tspan font-weight="bold" fill="#2563EB">√15, -√15</tspan></text>
      <text x="10" y="195"><tspan fill="#64748B">(vi)</tspan> 3x² - x - 4   → <tspan font-weight="bold" fill="#2563EB">4/3, -1</tspan></text>
    </g>
  </g>

  <!-- Central Divider with Algorithm Logic -->
  <line x1="270" y1="50" x2="270" y2="250" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="270" cy="150" r="18" fill="#FFFFFF" stroke="#E2E8F0"/>
  <path d="M264 145 L276 155 M276 145 L264 155" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="270" y="265" text-anchor="middle" fill="#64748B" font-size="8" font-family="'JetBrains Mono'">k[x² - (S)x + P]</text>

  <!-- Q2 Section -->
  <g transform="translate(275, 45)">
    <rect x="0" y="0" width="245" height="25" rx="4" fill="#F0FDF4" stroke="#16A34A" stroke-width="1" stroke-dasharray="2,1"/>
    <text x="122" y="17" text-anchor="middle" fill="#16A34A" font-size="10" font-weight="bold" font-family="'JetBrains Mono', sans-serif">Q2: FORM p(x) FROM S, P</text>
    
    <!-- Q2 Data Rows -->
    <g font-family="'JetBrains Mono', sans-serif" font-size="10" fill="#0F172A">
      <text x="10" y="45"><tspan fill="#64748B">(i)</tspan>  1/4, -1    → <tspan font-weight="bold" fill="#16A34A">4x² - x - 4</tspan></text>
      <text x="10" y="75"><tspan fill="#64748B">(ii)</tspan> √2, 1/3    → <tspan font-weight="bold" fill="#16A34A">3x² - 3√2x + 1</tspan></text>
      <text x="10" y="105"><tspan fill="#64748B">(iii)</tspan> 0, √5      → <tspan font-weight="bold" fill="#16A34A">x² + √5</tspan></text>
      <text x="10" y="135"><tspan fill="#64748B">(iv)</tspan> 1, 1       → <tspan font-weight="bold" fill="#16A34A">x² - x + 1</tspan></text>
      <text x="10" y="165"><tspan fill="#64748B">(v)</tspan>  -1/4, 1/4  → <tspan font-weight="bold" fill="#16A34A">4x² + x + 1</tspan></text>
      <text x="10" y="195"><tspan fill="#64748B">(vi)</tspan> 4, 1       → <tspan font-weight="bold" fill="#16A34A">x² - 4x + 1</tspan></text>
    </g>
  </g>

  <!-- Footer Legend / Formula -->
  <rect x="140" y="248" width="260" height="20" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="270" y="262" text-anchor="middle" fill="#475569" font-size="9" font-family="'JetBrains Mono'">Sum (S) = α+β | Product (P) = αβ</text>

  <!-- Decorative Flow Arrows -->
  <path d="M245 90 Q270 90 270 110" fill="none" stroke="#CBD5E1" stroke-width="1" marker-end="url(#arrowhead)"/>
  <path d="M295 90 Q270 90 270 110" fill="none" stroke="#CBD5E1" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#CBD5E1" />
    </marker>
    <style>
      @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.6; }
        100% { opacity: 1; }
      }
      .highlight-dot { animation: pulse 2s infinite ease-in-out; }
    </style>
  </defs>
  
  <!-- Status Indicators -->
  <circle cx="25" cy="22" r="3" fill="#2563EB" class="highlight-dot"/>
  <circle cx="515" cy="22" r="3" fill="#16A34A" class="highlight-dot"/>
</svg>