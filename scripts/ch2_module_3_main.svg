<svg viewBox="0 0 540 280" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <path d="M0,0 L8,3 L0,6 Z" fill="#0F172A" />
        </marker>
    </defs>

    <!-- Canvas backdrop -->
    <rect x="4" y="4" width="532" height="272" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Header pill badge -->
    <rect x="110" y="12" width="320" height="22" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="270" y="27" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="bold" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif">
        Relationship between Zeroes and Coefficients
    </text>

    <!-- Main Equation Block -->
    <rect x="50" y="60" width="440" height="40" rx="6" fill="#F0F8FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="270" y="85" fill="#0F172A" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
        ax² + bx + c  =  k(x - α)(x - β)
    </text>

    <!-- Arrows pointing down -->
    <!-- Arrow 1: From main equation to Sum of Zeroes -->
    <line x1="150" y1="100" x2="150" y2="140" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Arrow 2: From main equation to Product of Zeroes -->
    <line x1="390" y1="100" x2="390" y2="140" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Sum of Zeroes Block -->
    <rect x="40" y="140" width="220" height="100" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="150" y="175" fill="#16A34A" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
        Sum of Zeroes
    </text>
    <text x="150" y="210" fill="#0F172A" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif" font-size="16" text-anchor="middle">
        α + β = -b / a
    </text>

    <!-- Product of Zeroes Block -->
    <rect x="280" y="140" width="220" height="100" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="390" y="175" fill="#D97706" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
        Product of Zeroes
    </text>
    <text x="390" y="210" fill="#0F172A" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif" font-size="16" text-anchor="middle">
        α · β = c / a
    </text>
</svg>