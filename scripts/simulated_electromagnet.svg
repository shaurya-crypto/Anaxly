<svg viewBox="0 0 540 280" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#64748B"/>
    </marker>
    
    <!-- Gradients -->
    <linearGradient id="ironGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="35%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="ironEndGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect x="4" y="4" width="532" height="272" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Subtle Coordinate Grid -->
  <g stroke="#F8FAFC" stroke-width="0.75">
    <line x1="30" y1="4" x2="30" y2="276"/><line x1="70" y1="4" x2="70" y2="276"/>
    <line x1="110" y1="4" x2="110" y2="276"/><line x1="150" y1="4" x2="150" y2="276"/>
    <line x1="190" y1="4" x2="190" y2="276"/><line x1="230" y1="4" x2="230" y2="276"/>
    <line x1="270" y1="4" x2="270" y2="276"/><line x1="310" y1="4" x2="310" y2="276"/>
    <line x1="350" y1="4" x2="350" y2="276"/><line x1="390" y1="4" x2="390" y2="276"/>
    <line x1="430" y1="4" x2="430" y2="276"/><line x1="470" y1="4" x2="470" y2="276"/>
    <line x1="510" y1="4" x2="510" y2="276"/>
    <line x1="4" y1="40" x2="536" y2="40"/><line x1="4" y1="80" x2="536" y2="80"/>
    <line x1="4" y1="120" x2="536" y2="120"/><line x1="4" y1="160" x2="536" y2="160"/>
    <line x1="4" y1="200" x2="536" y2="200"/><line x1="4" y1="240" x2="536" y2="240"/>
  </g>

  <!-- Title Pill Header -->
  <rect x="95" y="10" width="350" height="22" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="270" y="25" text-anchor="middle" fill="#0F172A" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.3">ELECTROMAGNET: SOLENOID WITH SOFT IRON CORE</text>

  <!-- MAGNETIC FIELD LINES (Behind & Surrounding Coil) -->
  <g fill="none" stroke="#2563EB" stroke-dasharray="4,2.5" opacity="0.85">
    <!-- Top outer loop 1 -->
    <path d="M 188 116 C 188 40, 352 40, 352 116" stroke-width="1.3"/>
    <!-- Top inner loop 2 -->
    <path d="M 198 120 C 198 62, 342 62, 342 120" stroke-width="1.3"/>
    
    <!-- Bottom inner loop 2 -->
    <path d="M 342 136 C 342 194, 198 194, 198 136" stroke-width="1.3"/>
    <!-- Bottom outer loop 1 -->
    <path d="M 352 140 C 352 216, 188 216, 188 140" stroke-width="1.3"/>
  </g>

  <!-- Magnetic Field Direction Arrows on Loops -->
  <!-- Top loops: going left from S to N? Emerges from North (Left: 180) to South (Right: 360) -->
  <!-- Conventional solenoid: current flows over front upwards -> Left is North -->
  <path d="M 276 49 L 264 49" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <path d="M 276 71 L 264 71" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <!-- Bottom loops: returning to South from North (left to right) -->
  <path d="M 264 185 L 276 185" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <path d="M 264 207 L 276 207" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arr-blue)"/>

  <!-- Back Turns of Helical Solenoid (Drawn before Core) -->
  <g stroke="#B45309" stroke-width="2.6" fill="none" stroke-linecap="round">
    <path d="M 205 137 C 205 142, 218 142, 218 137"/>
    <path d="M 226 137 C 226 142, 239 142, 239 137"/>
    <path d="M 247 137 C 247 142, 260 142, 260 137"/>
    <path d="M 268 137 C 268 142, 281 142, 281 137"/>
    <path d="M 289 137 C 289 142, 302 142, 302 137"/>
    <path d="M 310 137 C 310 142, 323 142, 323 137"/>
    <path d="M 331 137 C 331 142, 344 137, 344 137"/>
  </g>

  <!-- SOFT IRON CORE (Cylinder) -->
  <g>
    <!-- Core Body -->
    <rect x="180" y="117" width="180" height="22" fill="url(#ironGrad)" stroke="#475569" stroke-width="1.2"/>
    <!-- Left Core Pole (North Face - Circular perspective) -->
    <ellipse cx="180" cy="128" rx="5" ry="11" fill="url(#ironEndGrad)" stroke="#475569" stroke-width="1.2"/>
    <!-- Right Core Pole (South Face - Curved outline) -->
    <path d="M 360 117 A 5 11 0 0 1 360 139" fill="none" stroke="#475569" stroke-width="1.2"/>
    <!-- Internal Dense Field Lines in Core -->
    <line x1="183" y1="124" x2="357" y2="124" stroke="#2563EB" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <line x1="183" y1="128" x2="357" y2="128" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.7"/>
    <line x1="183" y1="132" x2="357" y2="132" stroke="#2563EB" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <!-- Internal flux direction arrow (Inside core: S to N -> Right to Left) -->
    <path d="M 276 128 L 262 128" fill="none" stroke="#2563EB" stroke-width="1.3" marker-end="url(#arr-blue)"/>
  </g>

  <!-- Front Turns of Helical Solenoid (Drawn over Core) -->
  <g stroke="#D97706" stroke-width="2.6" fill="none" stroke-linecap="round">
    <!-- Turn 1 -->
    <path d="M 197 137 L 205 119 C 205 115, 218 115, 218 119"/>
    <path d="M 218 119 L 226 137"/>
    <!-- Turn 2 -->
    <path d="M 226 137 L 234 119 C 234 115, 247 115, 247 119"/>
    <path d="M 247 119 L 255 137"/>
    <!-- Turn 3 -->
    <path d="M 255 137 L 263 119 C 263 115, 276 115, 276 119"/>
    <path d="M 276 119 L 284 137"/>
    <!-- Turn 4 -->
    <path d="M 284 137 L 292 119 C 292 115, 305 115, 305 119"/>
    <path d="M 305 119 L 313 137"/>
    <!-- Turn 5 -->
    <path d="M 313 137 L 321 119 C 321 115, 334 115, 334 119"/>
    <path d="M 334 119 L 342 137"/>
  </g>

  <!-- Current Direction Arrows on Solenoid Front Turns -->
  <g fill="none" stroke="#16A34A" stroke-width="1.5">
    <path d="M 210 131 L 214 122" marker-end="url(#arr-green)"/>
    <path d="M 239 131 L 243 122" marker-end="url(#arr-green)"/>
    <path d="M 268 131 L 272 122" marker-end="url(#arr-green)"/>
    <path d="M 297 131 L 301 122" marker-end="url(#arr-green)"/>
    <path d="M 326 131 L 330 122" marker-end="url(#arr-green)"/>
  </g>

  <!-- EXTERNAL ELECTRICAL CIRCUIT -->
  <g stroke="#0F172A" stroke-width="1.6" fill="none" stroke-linejoin="round">
    <!-- Lead from Left (starts at Turn 1 base) -->
    <path d="M 197 137 L 197 238 L 248 238"/>
    <!-- Battery connected at (248, 238) to (292, 238) -->
    <!-- Lead to Switch & Right terminal -->
    <path d="M 292 238 L 315 238"/>
    <!-- Plug Key / Switch at (315, 238) to (342, 238) -->
    <path d="M 342 238 L 342 137"/>
  </g>

  <!-- Battery Symbols (DC Source) -->
  <g stroke="#0F172A" stroke-linecap="round">
    <!-- Cell 1: Long positive bar -->
    <line x1="248" y1="228" x2="248" y2="248" stroke-width="2"/>
    <!-- Short negative bar -->
    <line x1="254" y1="232" x2="254" y2="244" stroke-width="3"/>
    <!-- Cell 2: Long bar -->
    <line x1="262" y1="228" x2="262" y2="248" stroke-width="2"/>
    <!-- Short negative bar -->
    <line x1="268" y1="232" x2="268" y2="244" stroke-width="3"/>
    <!-- Connector between cells -->
    <line x1="254" y1="238" x2="262" y2="238" stroke-width="1.2"/>
    <line x1="268" y1="238" x2="276" y2="238" stroke-width="1.2"/>
    <!-- Cell 3: Long bar -->
    <line x1="276" y1="228" x2="276" y2="248" stroke-width="2"/>
    <!-- Short negative bar -->
    <line x1="282" y1="232" x2="282" y2="244" stroke-width="3"/>
    <line x1="282" y1="238" x2="292" y2="238" stroke-width="1.2"/>
  </g>

  <!-- Battery Polarity Indicators -->
  <text x="241" y="233" fill="#DC2626" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">+</text>
  <text x="288" y="233" fill="#2563EB" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">−</text>

  <!-- Switch / Plug Key (Closed State) -->
  <g>
    <!-- Key brackets ( ) -->
    <path d="M 320 232 C 322 235, 322 241, 320 244" stroke="#0F172A" stroke-width="1.5" fill="none"/>
    <path d="M 334 232 C 332 235, 332 241, 334 244" stroke="#0F172A" stroke-width="1.5" fill="none"/>
    <!-- Inserted plug dot -->
    <circle cx="327" cy="238" r="2.2" fill="#0F172A"/>
    <text x="327" y="254" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="8.5" font-weight="600">Key (Closed)</text>
  </g>

  <!-- Circuit Current Arrows (Green) -->
  <path d="M 197 195 L 197 182" fill="none" stroke="#16A34A" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <text x="187" y="190" fill="#16A34A" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">I</text>
  <path d="M 342 182 L 342 195" fill="none" stroke="#16A34A" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <text x="351" y="190" fill="#16A34A" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">I</text>

  <!-- MAGNETIC POLE INDICATORS (Left: North, Right: South) -->
  <!-- North Pole Badge -->
  <rect x="144" y="117" width="28" height="22" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="158" y="133" text-anchor="middle" fill="#DC2626" font-family="'JetBrains Mono', sans-serif" font-size="12" font-weight="800">N</text>
  <!-- South Pole Badge -->
  <rect x="368" y="117" width="28" height="22" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="382" y="133" text-anchor="middle" fill="#2563EB" font-family="'JetBrains Mono', sans-serif" font-size="12" font-weight="800">S</text>

  <!-- Field Line Emergence & Entry Vectors -->
  <path d="M 142 128 L 126 128" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <path d="M 412 128 L 398 128" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-slate)"/>

  <!-- SMART LABELS & POINTER CALLOUTS (LEFT SIDE, anchor end <= 125) -->
  <!-- Callout 1: Magnetic Field Loops -->
  <circle cx="230" cy="53" r="2.5" fill="#2563EB"/>
  <polyline points="230,53 130,53" fill="none" stroke="#94A3B8" stroke-width="1"/>
  <text x="125" y="50" text-anchor="end" fill="#0F172A" font-family="sans-serif" font-size="9.5" font-weight="700">Magnetic Field Line (B)</text>
  <text x="125" y="60" text-anchor="end" fill="#64748B" font-family="sans-serif" font-size="8">Continuous closed loop</text>

  <!-- Callout 2: North Pole Induced -->
  <polyline points="144,128 125,128" fill="none" stroke="#94A3B8" stroke-width="1"/>
  <text x="120" y="125" text-anchor="end" fill="#DC2626" font-family="sans-serif" font-size="9.5" font-weight="700">North Magnetic Pole</text>
  <text x="120" y="135" text-anchor="end" fill="#64748B" font-family="sans-serif" font-size="8">Lines emerge outwards</text>

  <!-- Callout 3: Conventional Current -->
  <circle cx="197" cy="188" r="2.5" fill="#16A34A"/>
  <polyline points="197,188 135,188" fill="none" stroke="#94A3B8" stroke-width="1"/>
  <text x="130" y="185" text-anchor="end" fill="#16A34A" font-family="sans-serif" font-size="9.5" font-weight="700">Electric Current (I)</text>
  <text x="130" y="195" text-anchor="end" fill="#64748B" font-family="sans-serif" font-size="8">From DC positive (+) terminal</text>

  <!-- SMART LABELS & POINTER CALLOUTS (RIGHT SIDE, anchor start >= 415) -->
  <!-- Callout 4: Insulated Copper Windings -->
  <circle cx="308" cy="116" r="2.5" fill="#D97706"/>
  <polyline points="308,116 415,62" fill="none" stroke="#94A3B8" stroke-width="1"/>
  <text x="418" y="59" text-anchor="start" fill="#B45309" font-family="sans-serif" font-size="9.5" font-weight="700">Helical Solenoid</text>
  <text x="418" y="69" text-anchor="start" fill="#64748B" font-family="sans-serif" font-size="8">Insulated copper windings (n turns)</text>

  <!-- Callout 5: Soft Iron Core -->
  <circle cx="348" cy="128" r="2.5" fill="#475569"/>
  <polyline points="348,128 415,100" fill="none" stroke="#94A3B8" stroke-width="1"/>
  <text x="418" y="97" text-anchor="start" fill="#0F172A" font-family="sans-serif" font-size="9.5" font-weight="700">Soft Iron Core</text>
  <text x="418" y="107" text-anchor="start" fill="#64748B" font-family="sans-serif" font-size="8">High permeability (μ ≫ μ₀)</text>

  <!-- Callout 6: South Pole Induced -->
  <polyline points="396,128 415,135" fill="none" stroke="#94A3B8" stroke-width="1"/>
  <text x="418" y="134" text-anchor="start" fill="#2563EB" font-family="sans-serif" font-size="9.5" font-weight="700">South Magnetic Pole</text>
  <text x="418" y="144" text-anchor="start" fill="#64748B" font-family="sans-serif" font-size="8">Lines enter inwards</text>

  <!-- Callout 7: Temporary Electromagnetism Note -->
  <circle cx="342" cy="188" r="2.5" fill="#0F172A"/>
  <polyline points="342,188 415,188" fill="none" stroke="#94A3B8" stroke-width="1"/>
  <text x="418" y="185" text-anchor="start" fill="#0F172A" font-family="sans-serif" font-size="9" font-weight="700">Temporary Magnet</text>
  <text x="418" y="195" text-anchor="start" fill="#64748B" font-family="sans-serif" font-size="8">Field ceases when switch opened</text>

  <!-- Governing Physics Formula Badge (Bottom Left/Center) -->
  <g>
    <rect x="22" y="226" width="138" height="38" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="91" y="239" text-anchor="middle" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">B = μ · n · I</text>
    <text x="91" y="252" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="7.5">Field inside core (Tesla)</text>
  </g>

  <!-- Battery Label Bottom Center -->
  <text x="270" y="260" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="8.5" font-weight="600">DC Battery Source</text>
</svg>