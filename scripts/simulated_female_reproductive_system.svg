<svg viewBox="0 0 540 280" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <!-- Canvas Background -->
  <rect x="4" y="4" width="532" height="272" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Subtle Coordinate Grid -->
  <g stroke="#F1F5F9" stroke-width="0.75">
    <line x1="4" y1="50" x2="536" y2="50"/>
    <line x1="4" y1="100" x2="536" y2="100"/>
    <line x1="4" y1="150" x2="536" y2="150"/>
    <line x1="4" y1="200" x2="536" y2="200"/>
    <line x1="4" y1="250" x2="536" y2="250"/>
    <line x1="50" y1="4" x2="50" y2="276"/>
    <line x1="100" y1="4" x2="100" y2="276"/>
    <line x1="150" y1="4" x2="150" y2="276"/>
    <line x1="200" y1="4" x2="200" y2="276"/>
    <line x1="250" y1="4" x2="250" y2="276"/>
    <line x1="300" y1="4" x2="300" y2="276"/>
    <line x1="350" y1="4" x2="350" y2="276"/>
    <line x1="400" y1="4" x2="400" y2="276"/>
    <line x1="450" y1="4" x2="450" y2="276"/>
    <line x1="500" y1="4" x2="500" y2="276"/>
  </g>

  <!-- Header Pill Badge -->
  <rect x="110" y="14" width="320" height="22" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="270" y="28" text-anchor="middle" fill="#1E293B" font-size="11" font-weight="bold" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif">
    Human Female Reproductive System
  </text>

  <!-- Anatomical Structure -->
  <g transform="translate(0, 0)">
    <!-- Uterus (Muscular Wall) -->
    <path d="M270,100 C220,90 190,130 190,170 C190,200 220,220 270,220 C320,220 350,200 350,170 C350,130 320,90 270,100 Z"
          fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>

    <!-- Endometrial Lining -->
    <path d="M270,108 C230,100 205,130 205,165 C205,190 230,205 270,205 C310,205 335,190 335,165 C335,130 310,100 270,108 Z"
          fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>

    <!-- Cervix -->
    <path d="M270,220 C240,220 230,230 230,240 L310,240 C310,230 300,220 270,220 Z"
          fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>

    <!-- Vagina -->
    <path d="M230,240 L220,260 L320,260 L310,240 Z"
          fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>

    <!-- Left Fallopian Tube (Oviduct) -->
    <path d="M190,110 C160,90 140,90 120,110 C100,130 100,150 120,170 C140,190 160,190 190,170 L190,110 Z"
          fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
    <!-- Left Fimbriae -->
    <path d="M120,170 L110,175 M120,170 L115,180 M120,170 L120,185 M120,170 L125,180 M120,170 L130,175"
          fill="none" stroke="#2563EB" stroke-width="1.5"/>

    <!-- Right Fallopian Tube (Oviduct) -->
    <path d="M350,110 C380,90 400,90 420,110 C440,130 440,150 420,170 C400,190 380,190 350,170 L350,110 Z"
          fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
    <!-- Right Fimbriae -->
    <path d="M420,170 L430,175 M420,170 L425,180 M420,170 L420,185 M420,170 L415,180 M420,170 L410,175"
          fill="none" stroke="#2563EB" stroke-width="1.5"/>

    <!-- Left Ovary -->
    <ellipse cx="100" cy="140" rx="20" ry="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>

    <!-- Right Ovary -->
    <ellipse cx="440" cy="140" rx="20" ry="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
  </g>

  <!-- Callout Pointers and Labels -->
  <g font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#0F172A">
    <!-- Left Side Labels -->
    <!-- Left Ovary -->
    <circle cx="100" cy="140" r="2.5" fill="#2563EB"/>
    <polyline points="100,140 50,140 50,150" fill="none" stroke="#94A3B8" stroke-width="1"/>
    <text x="50" y="160" text-anchor="end">Ovary</text>

    <!-- Left Fallopian Tube (Oviduct) -->
    <circle cx="150" cy="130" r="2.5" fill="#2563EB"/>
    <polyline points="150,130 80,130 80,110" fill="none" stroke="#94A3B8" stroke-width="1"/>
    <text x="80" y="120" text-anchor="end">Fallopian Tube</text>
    <text x="80" y="132" text-anchor="end">(Oviduct)</text>

    <!-- Left Fimbriae -->
    <circle cx="120" cy="170" r="2.5" fill="#2563EB"/>
    <polyline points="120,170 60,170 60,190" fill="none" stroke="#94A3B8" stroke-width="1"/>
    <text x="60" y="200" text-anchor="end">Fimbriae</text>

    <!-- Right Side Labels -->
    <!-- Uterus -->
    <circle cx="270" cy="160" r="2.5" fill="#2563EB"/>
    <polyline points="270,160 400,160 400,100" fill="none" stroke="#94A3B8" stroke-width="1"/>
    <text x="400" y="110" text-anchor="start">Uterus</text>

    <!-- Endometrial Lining -->
    <circle cx="270" cy="120" r="2.5" fill="#2563EB"/>
    <polyline points="270,120 400,120 400,130" fill="none" stroke="#94A3B8" stroke-width="1"/>
    <text x="400" y="140" text-anchor="start">Endometrial Lining</text>

    <!-- Cervix -->
    <circle cx="270" cy="230" r="2.5" fill="#2563EB"/>
    <polyline points="270,230 400,230 400,170" fill="none" stroke="#94A3B8" stroke-width="1"/>
    <text x="400" y="180" text-anchor="start">Cervix</text>

    <!-- Vagina -->
    <circle cx="270" cy="250" r="2.5" fill="#2563EB"/>
    <polyline points="270,250 400,250 400,200" fill="none" stroke="#94A3B8" stroke-width="1"/>
    <text x="400" y="210" text-anchor="start">Vagina</text>

    <!-- Site of Fertilization -->
    <circle cx="380" cy="130" r="2.5" fill="#2563EB"/>
    <polyline points="380,130 450,130 450,230" fill="none" stroke="#94A3B8" stroke-width="1"/>
    <text x="450" y="240" text-anchor="start">Site of Fertilization</text>
  </g>
</svg>