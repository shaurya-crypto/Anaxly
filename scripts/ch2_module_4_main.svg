<svg viewBox="0 0 540 280" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" xmlns="http://www.w3.org/2000/svg">
  <!-- Canvas Background -->
  <rect x="4" y="4" width="532" height="272" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  
  <!-- Header Pill Badge -->
  <rect x="110" y="10" width="320" height="22" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="270" y="25" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="bold" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif">Exercise 2.1: Graph-Based Zero Identification</text>

  <!-- GRAPH (i) -->
  <g transform="translate(25, 42)">
    <rect width="150" height="95" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Grid lines -->
    <line x1="15" y1="52" x2="135" y2="52" stroke="#0F172A" stroke-width="1.2"/>
    <line x1="75" y1="15" x2="75" y2="80" stroke="#0F172A" stroke-width="1.2"/>
    <!-- Function curve -->
    <line x1="20" y1="30" x2="130" y2="30" stroke="#2563EB" stroke-width="2"/>
    <!-- Label -->
    <text x="75" y="90" fill="#0F172A" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">(i) 0 zeroes</text>
  </g>

  <!-- GRAPH (ii) -->
  <g transform="translate(195, 42)">
    <rect width="150" height="95" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="15" y1="52" x2="135" y2="52" stroke="#0F172A" stroke-width="1.2"/>
    <line x1="75" y1="15" x2="75" y2="80" stroke="#0F172A" stroke-width="1.2"/>
    <path d="M 30,75 Q 75,52 120,25" fill="none" stroke="#2563EB" stroke-width="2"/>
    <circle cx="75" cy="52" r="3.5" fill="#DC2626"/>
    <text x="75" y="90" fill="#0F172A" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">(ii) 1 zero</text>
  </g>

  <!-- GRAPH (iii) -->
  <g transform="translate(365, 42)">
    <rect width="150" height="95" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="15" y1="52" x2="135" y2="52" stroke="#0F172A" stroke-width="1.2"/>
    <line x1="75" y1="15" x2="75" y2="80" stroke="#0F172A" stroke-width="1.2"/>
    <path d="M 25,78 Q 45,15 65,52 T 105,52 T 135,25" fill="none" stroke="#2563EB" stroke-width="2"/>
    <circle cx="43" cy="52" r="3.5" fill="#DC2626"/>
    <circle cx="65" cy="52" r="3.5" fill="#DC2626"/>
    <circle cx="103" cy="52" r="3.5" fill="#DC2626"/>
    <text x="75" y="90" fill="#0F172A" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">(iii) 3 zeroes</text>
  </g>

  <!-- GRAPH (iv) -->
  <g transform="translate(25, 155)">
    <rect width="150" height="95" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="15" y1="52" x2="135" y2="52" stroke="#0F172A" stroke-width="1.2"/>
    <line x1="75" y1="15" x2="75" y2="80" stroke="#0F172A" stroke-width="1.2"/>
    <path d="M 35,22 Q 75,85 115,22" fill="none" stroke="#2563EB" stroke-width="2"/>
    <circle cx="50" cy="52" r="3.5" fill="#DC2626"/>
    <circle cx="100" cy="52" r="3.5" fill="#DC2626"/>
    <text x="75" y="90" fill="#0F172A" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">(iv) 2 zeroes</text>
  </g>

  <!-- GRAPH (v) -->
  <g transform="translate(195, 155)">
    <rect width="150" height="95" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="15" y1="52" x2="135" y2="52" stroke="#0F172A" stroke-width="1.2"/>
    <line x1="75" y1="15" x2="75" y2="80" stroke="#0F172A" stroke-width="1.2"/>
    <path d="M 25,25 Q 50,75 75,52 Q 100,75 125,25" fill="none" stroke="#2563EB" stroke-width="2"/>
    <circle cx="75" cy="52" r="3.5" fill="#DC2626"/>
    <text x="75" y="90" fill="#0F172A" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">(v) 1 zero</text>
  </g>

  <!-- GRAPH (vi) -->
  <g transform="translate(365, 155)">
    <rect width="150" height="95" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="15" y1="52" x2="135" y2="52" stroke="#0F172A" stroke-width="1.2"/>
    <line x1="75" y1="15" x2="75" y2="80" stroke="#0F172A" stroke-width="1.2"/>
    <path d="M 20,25 Q 32,75 45,52 Q 58,30 72,52 Q 85,75 98,52 Q 112,30 130,25" fill="none" stroke="#2563EB" stroke-width="2"/>
    <circle cx="40" cy="52" r="3.5" fill="#DC2626"/>
    <circle cx="58" cy="52" r="3.5" fill="#DC2626"/>
    <circle cx="89" cy="52" r="3.5" fill="#DC2626"/>
    <circle cx="108" cy="52" r="3.5" fill="#DC2626"/>
    <text x="75" y="90" fill="#0F172A" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">(vi) 4 zeroes</text>
  </g>
</svg>