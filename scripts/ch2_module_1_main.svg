<svg viewBox="0 0 540 280" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#F1F5F9" stroke-width="0.75"/>
    </pattern>
  </defs>

  <!-- Canvas Backdrop -->
  <rect x="4" y="4" width="532" height="272" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="4" y="4" width="532" height="272" rx="8" fill="url(#grid)"/>

  <!-- Top Header Pill Badge -->
  <rect x="110" y="10" width="320" height="22" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="270" y="25" text-anchor="middle" fill="#0F172A" font-size="10.5" font-weight="bold" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif" letter-spacing="0.5">POLYNOMIAL VS NON-POLYNOMIAL EXPRESSIONS</text>

  <!-- ================= LEFT PANEL: VALID POLYNOMIALS ================= -->
  <rect x="16" y="38" width="248" height="230" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.2"/>
  
  <!-- Panel Header -->
  <rect x="26" y="46" width="228" height="24" rx="5" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <text x="140" y="62" text-anchor="middle" fill="#15803D" font-size="11" font-weight="bold" font-family="'Segoe UI', system-ui, sans-serif">✓ VALID POLYNOMIALS</text>

  <!-- Rule Highlight Banner -->
  <rect x="26" y="75" width="228" height="20" rx="4" fill="#F0FDF4"/>
  <text x="140" y="89" text-anchor="middle" fill="#166534" font-size="9" font-weight="600" font-family="'Segoe UI', system-ui, sans-serif">Rule: Exponents must be Whole Numbers {0, 1, 2, ...}</text>

  <!-- Row 1: Cubic -->
  <g transform="translate(26, 100)">
    <rect x="0" y="0" width="228" height="34" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="12" y="21" fill="#0F172A" font-size="12" font-weight="bold" font-family="'JetBrains Mono', monospace">
      P(x) = 4x<tspan dy="-4" font-size="9" fill="#16A34A">3</tspan><tspan dy="4"> - 2x + 7</tspan>
    </text>
    <rect x="142" y="8" width="76" height="18" rx="4" fill="#DCFCE7"/>
    <text x="180" y="21" text-anchor="middle" fill="#15803D" font-size="8.5" font-weight="bold" font-family="'Segoe UI', sans-serif">Degree 3 (Cubic)</text>
  </g>

  <!-- Row 2: Quadratic with Real Coeff -->
  <g transform="translate(26, 139)">
    <rect x="0" y="0" width="228" height="34" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="12" y="21" fill="#0F172A" font-size="12" font-weight="bold" font-family="'JetBrains Mono', monospace">
      Q(y) = √3 y<tspan dy="-4" font-size="9" fill="#16A34A">2</tspan><tspan dy="4"> + 5y</tspan>
    </text>
    <rect x="132" y="8" width="86" height="18" rx="4" fill="#DCFCE7"/>
    <text x="175" y="21" text-anchor="middle" fill="#15803D" font-size="8.5" font-weight="bold" font-family="'Segoe UI', sans-serif">√3 is Coeff (Valid)</text>
  </g>

  <!-- Row 3: Linear -->
  <g transform="translate(26, 178)">
    <rect x="0" y="0" width="228" height="34" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="12" y="21" fill="#0F172A" font-size="12" font-weight="bold" font-family="'JetBrains Mono', monospace">
      R(x) = 7x<tspan dy="-4" font-size="9" fill="#16A34A">1</tspan><tspan dy="4"> - 12</tspan>
    </text>
    <rect x="140" y="8" width="78" height="18" rx="4" fill="#DCFCE7"/>
    <text x="179" y="21" text-anchor="middle" fill="#15803D" font-size="8.5" font-weight="bold" font-family="'Segoe UI', sans-serif">Degree 1 (Linear)</text>
  </g>

  <!-- Bottom Summary Note - Valid -->
  <rect x="26" y="217" width="228" height="42" rx="5" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="140" y="233" text-anchor="middle" fill="#15803D" font-size="9" font-weight="bold" font-family="'Segoe UI', system-ui, sans-serif">★ Variable exponents MUST be non-negative integers</text>
  <text x="140" y="248" text-anchor="middle" fill="#166534" font-size="8.5" font-family="'Segoe UI', system-ui, sans-serif">Coefficients (e.g. √3, ½) can be any real number</text>

  <!-- ================= RIGHT PANEL: NON-POLYNOMIALS ================= -->
  <rect x="276" y="38" width="248" height="230" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
  
  <!-- Panel Header -->
  <rect x="286" y="46" width="228" height="24" rx="5" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="400" y="62" text-anchor="middle" fill="#B91C1C" font-size="11" font-weight="bold" font-family="'Segoe UI', system-ui, sans-serif">✗ NOT POLYNOMIALS</text>

  <!-- Rule Highlight Banner -->
  <rect x="286" y="75" width="228" height="20" rx="4" fill="#FEF2F2"/>
  <text x="400" y="89" text-anchor="middle" fill="#991B1B" font-size="9" font-weight="600" font-family="'Segoe UI', system-ui, sans-serif">Violation: Negative, fractional, or variable power</text>

  <!-- Row 1: Negative Exponent -->
  <g transform="translate(286, 100)">
    <rect x="0" y="0" width="228" height="34" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="12" y="21" fill="#0F172A" font-size="12" font-weight="bold" font-family="'JetBrains Mono', monospace">
      3x<tspan dy="-4" font-size="9" font-weight="bold" fill="#DC2626">-2</tspan><tspan dy="4"> + 5x</tspan>
    </text>
    <rect x="126" y="8" width="92" height="18" rx="4" fill="#FEE2E2"/>
    <text x="172" y="21" text-anchor="middle" fill="#991B1B" font-size="8.5" font-weight="bold" font-family="'Segoe UI', sans-serif">Negative Exponent (-2)</text>
  </g>

  <!-- Row 2: Square Root / Fractional -->
  <g transform="translate(286, 139)">
    <rect x="0" y="0" width="228" height="34" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="12" y="21" fill="#0F172A" font-size="12" font-weight="bold" font-family="'JetBrains Mono', monospace">
      2√x + 4 <tspan font-size="10" fill="#64748B">(2x<tspan dy="-4" font-size="8" fill="#DC2626">½</tspan><tspan dy="4">)</tspan></tspan>
    </text>
    <rect x="128" y="8" width="90" height="18" rx="4" fill="#FEE2E2"/>
    <text x="173" y="21" text-anchor="middle" fill="#991B1B" font-size="8.5" font-weight="bold" font-family="'Segoe UI', sans-serif">Fractional Power (½)</text>
  </g>

  <!-- Row 3: Variable in Denominator -->
  <g transform="translate(286, 178)">
    <rect x="0" y="0" width="228" height="34" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="12" y="21" fill="#0F172A" font-size="12" font-weight="bold" font-family="'JetBrains Mono', monospace">
      5 / (x + 1)
    </text>
    <rect x="114" y="8" width="104" height="18" rx="4" fill="#FEE2E2"/>
    <text x="166" y="21" text-anchor="middle" fill="#991B1B" font-size="8.5" font-weight="bold" font-family="'Segoe UI', sans-serif">Variable in Denominator</text>
  </g>

  <!-- Bottom Summary Note - Invalid -->
  <rect x="286" y="217" width="228" height="42" rx="5" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="400" y="233" text-anchor="middle" fill="#B91C1C" font-size="9" font-weight="bold" font-family="'Segoe UI', system-ui, sans-serif">⚠ EXCLUDED: x⁻ⁿ, x¹/ⁿ, 1/x, √x, or aⁿ</text>
  <text x="400" y="248" text-anchor="middle" fill="#991B1B" font-size="8.5" font-family="'Segoe UI', system-ui, sans-serif">Variables cannot be under radical or in denominator</text>
</svg>